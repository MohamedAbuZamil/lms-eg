services:
  postgres_identity:
    image: postgres:16
    container_name: lms_postgres_identity
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: identity_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data

  postgres_commerce:
    image: postgres:16
    container_name: lms_postgres_commerce
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: commerce_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_commerce_data:/var/lib/postgresql/data

  postgres_course:
    image: postgres:16
    container_name: lms_postgres_course
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: course_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_course_data:/var/lib/postgresql/data

  postgres_staff:
    image: postgres:16
    container_name: lms_postgres_staff
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: staff_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_staff_data:/var/lib/postgresql/data

  postgres_enrollment:
    image: postgres:16
    container_name: lms_postgres_enrollment
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: enrollment_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_enrollment_data:/var/lib/postgresql/data

  postgres_content:
    image: postgres:16
    container_name: lms_postgres_content
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: content_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_content_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lms_redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    container_name: lms_nats

volumes:
  postgres_identity_data:
  postgres_commerce_data:
  postgres_course_data:
  postgres_staff_data:
  postgres_enrollment_data:
  postgres_content_data: