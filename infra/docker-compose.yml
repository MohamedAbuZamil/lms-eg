services:
  postgres_identity:
    image: postgres:16
    container_name: lms_postgres_identity
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: identity_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data

  postgres_commerce:
    image: postgres:16
    container_name: lms_postgres_commerce
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: commerce_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_commerce_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: lms_redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2
    container_name: lms_nats
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  postgres_identity_data:
  postgres_commerce_data: